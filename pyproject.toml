[project]
name = "nlq"
version = "0.1.0"
description = "Governed metric layer and Bedrock text-to-SQL with a SQL guard and execution-accuracy eval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
